[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-facts"
version = "1.0.0"
description = "A mini RAG system that emails source-grounded facts about a topic."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "wikipedia==1.4.0",
    "python-dotenv>=1.0",
    "email-validator>=2.0",
    "faiss-cpu>=1.8",
    "openai>=1.30",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=2.2"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["backend", "backend.rag", "backend.services"]
